<!DOCTYPE html>
<html lang="ru">
<head>

  <title>Портфолио 2026 — Мондракова Софья</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

      <a href="https://t.me/bixb_m" target="_blank" rel="noopener" class="phone-link" data-hover>
        +7 952 935 9491
      </a>
